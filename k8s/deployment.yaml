apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-restaurant-app
  namespace: symfony-restaurant
  labels:
    app: symfony-restaurant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: symfony-restaurant-app
  template:
    metadata:
      labels:
        app: symfony-restaurant-app
    spec:
      containers:
        - name: php-fpm
          image: 153806140965.dkr.ecr.eu-west-1.amazonaws.com/symfony-restaurant-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: php
          envFrom:
            - configMapRef:
                name: symfony-config
            - secretRef:
                name: symfony-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20

        - name: nginx
          image: nginx:alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: nginx-config
          configMap:
            name: symfony-nginx-config
