services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      APP_ENV: prod
      APP_SECRET: change_me_for_prod
      ADMIN_EMAIL: admin@restaurant.local
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Administrateur
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "9000:9000"
    volumes:
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./public:/var/www/symfony/public
    depends_on:
      - db
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/symfony/public:ro
    networks:
      - appnet

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: symfresto07
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
